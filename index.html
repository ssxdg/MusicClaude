<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>音乐云 · Music Cloud</title>
    <meta name="description" content="本地网易云音乐三维播放器：歌手化作主星，歌曲围绕主星运行。" />
    <meta name="theme-color" content="#07080f" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <!-- share preview (OG/Twitter). __OG_ORIGIN__ is replaced at build time from VITE_SITE_ORIGIN
         (vite.config.ts) — unset it falls back to a root-relative path, which most CN apps and
         Telegram resolve; set it before deploy so Facebook/X also get an absolute URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="音乐云 · Music Cloud" />
    <meta property="og:title" content="音乐云 · Music Cloud" />
    <meta property="og:description" content="在本地三维星河中浏览网易云歌单，歌手是主星，歌曲是行星。" />
    <meta property="og:image" content="__OG_ORIGIN__/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="音乐云 · Music Cloud" />
    <meta name="twitter:description" content="在本地三维星河中浏览网易云歌单。" />
    <meta name="twitter:image" content="__OG_ORIGIN__/og.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // capability gate — plain ES5 on purpose: browsers too old for the app (no BigInt → the
      // ES2022 bundle won't even parse) still parse THIS and get a human message instead of a
      // black screen. Also catches WebGL-less environments (blocked GPU / remote desktop).
      (function () {
        var msg = null;
        if (typeof BigInt === "undefined") {
          msg = "你的浏览器过旧，无法运行音乐云的三维引擎。请换用较新的 Chrome / Edge / Safari / Firefox。";
        } else {
          try {
            var c = document.createElement("canvas");
            if (!c.getContext("webgl2") && !c.getContext("webgl")) {
              msg = "此设备或浏览器没有可用的 WebGL，无法渲染音乐星图。请换用支持 WebGL 的浏览器，或检查显卡/远程桌面设置。";
            }
          } catch (e) {
            msg = "此设备或浏览器没有可用的 WebGL，无法渲染音乐星图。";
          }
        }
        if (msg) {
          // flag checked by main.tsx: a WebGL-less but otherwise-modern browser CAN run the module
          // bundle — without this flag React would mount over the message and then black-screen.
          window.__SHIYUN_UNSUPPORTED__ = true;
          document.getElementById("root").innerHTML =
            '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#07080f;color:#d8c89a;font-family:serif;padding:24px;text-align:center">' +
            '<div style="font-size:34px;letter-spacing:.3em;margin-bottom:18px">音乐云</div>' +
            '<div style="font-size:14px;line-height:1.8;max-width:30em;color:#b9c2d6">' + msg + "</div></div>";
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
